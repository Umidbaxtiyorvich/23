# Render Blueprint: Dashboard → New → Blueprint → shu repozitoriyni tanlang.
# Bitta Docker web-servis (frontend + backend birga). Yangi baza YARATILMAYDI:
# mavjud PostgreSQL bazangiz manzilini DATABASE_URL ga kiriting. Jadvallar o'sha bazada
# alohida "ielts" schema ichida yaratiladi — bazadagi boshqa jadvallarga tegilmaydi.
services:
  - type: web
    name: ielts-ai-master
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # Render → PostgreSQL bazangiz → Connect → "External Database URL"
        sync: false
      - key: DB_SCHEMA
        value: ielts
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD      # kuchli parol qo'ying
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
